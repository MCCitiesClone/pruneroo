# Production Postgres for Pruneroo, run on the Wings host.
#
# The panel's own "Databases" feature provisions MySQL/MariaDB only, and this
# schema is Postgres-specific (advisory locks, timestamptz, the views in
# src/lib/db/views.sql), so the database lives beside Wings rather than inside
# the panel.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: pruneroo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pruneroo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/postgres/.env}
      POSTGRES_DB: pruneroo
    # Docker defaults /dev/shm to 64MB, which Postgres exhausts as soon as a
    # parallel query needs a shared hash table — the insight views scan ~8k
    # regions and hit "could not resize shared memory segment" (SQLSTATE 53100).
    shm_size: 512mb
    # Bound to the Wings bridge gateway, not 0.0.0.0: game-server containers on
    # pelican_nw can reach it, the public internet cannot. Confirm the address
    # with `docker network inspect pelican_nw -f '{{(index .IPAM.Config 0).Gateway}}'`
    # and change it here if your Wings network interface differs.
    ports:
      - "${DB_BIND_IP:-172.18.0.1}:5432:5432"
    command:
      - postgres
      # Conservative for a shared game node. On a box with RAM to spare, raise
      # shared_buffers to ~25% of host memory and effective_cache_size to ~50%.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    volumes:
      - pruneroo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pruneroo -d pruneroo"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pruneroo-pgdata:
